# Generated by OrchestKit Claude Plugin
# Created: 2026-08-29

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck

      - name: Write the giveaway denylist from the repo secret (optional)
        env:
          DENYLIST: ${{ secrets.GIVEAWAY_DENYLIST }}
        run: |
          if [ -n "$DENYLIST" ]; then
            printf '%s\n' "$DENYLIST" > "$RUNNER_TEMP/denylist.txt"
            echo "GIVEAWAY_DENYLIST_FILE=$RUNNER_TEMP/denylist.txt" >> "$GITHUB_ENV"
          else
            echo "no GIVEAWAY_DENYLIST secret; generic patterns only"
          fi

      - name: validate-kit (house validator + kit checks + giveaway lint)
        run: bash scripts/validate-kit.sh

      - name: smoke-install
        run: bash scripts/smoke-install.sh

      - name: Gate self-test (a planted bad skill must FAIL the validator)
        run: |
          tmp="$(mktemp -d)"
          cp -R skills/. "$tmp/"
          mkdir -p "$tmp/planted-bad"
          printf -- '---\nname: planted-bad\ndescription: no tail\n---\n# bad\n' > "$tmp/planted-bad/SKILL.md"
          rc=0
          RAIL_KIT_SKILLS_DIR="$tmp" bash scripts/validate-skills.sh > "$tmp/out.txt" 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "validator passed a planted bad skill: the gate is inert"
            cat "$tmp/out.txt"
            exit 1
          fi
          echo "gate self-test ok (validator exited $rc on the planted skill)"

      - name: build-zip (dry run, asset must exclude .github and scripts)
        run: |
          bash scripts/build-zip.sh
          if unzip -l dist/rail-kit.zip | grep -qE 'rail-kit/(\.github|scripts)/'; then
            echo "zip contains .github/ or scripts/"; exit 1
          fi
          unzip -l dist/rail-kit.zip | tail -1
