# Generated by OrchestKit Claude Plugin
# Created: 2026-08-29

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag must equal the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag != plugin.json version $ver"; exit 1
          fi

      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck

      - name: validate-kit
        run: bash scripts/validate-kit.sh

      - name: build-zip
        run: bash scripts/build-zip.sh

      - name: Sigstore provenance attestation (skills + zip)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/rail-kit.zip
            skills/*/SKILL.md
            skills/*/SKILL_HE.md
            skills/*/metadata.json

      - name: GitHub Release with rail-kit.zip
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/rail-kit.zip
          body_path: dist/notes.md
