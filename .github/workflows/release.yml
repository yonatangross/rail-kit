# Generated by OrchestKit Claude Plugin
# Created: 2026-08-29

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must equal the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag != plugin.json version $ver"; exit 1
          fi

      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck

      - name: validate-kit
        run: bash scripts/validate-kit.sh

      - name: build-zip
        run: bash scripts/build-zip.sh

      - name: GitHub Release with rail-kit.zip
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rail-kit.zip
          body_path: dist/notes.md
