# Generated by OrchestKit Claude Plugin
# Created: 2026-08-29

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Tag must equal the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag != plugin.json version $ver"; exit 1
          fi

      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck

      - name: validate-kit
        run: bash scripts/validate-kit.sh

      - name: build-zip
        run: bash scripts/build-zip.sh

      - name: Sigstore provenance attestation (skills + zip)
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4 # v4
        with:
          subject-path: |
            dist/rail-kit.zip
            skills/*/SKILL.md
            skills/*/SKILL_HE.md
            skills/*/metadata.json

      - name: GitHub Release with rail-kit.zip
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/rail-kit.zip
          body_path: dist/notes.md
